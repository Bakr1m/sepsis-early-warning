name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check src api tests dashboard
      - name: Tests
        run: python -m pytest tests/ -q

  docker:
    needs: test # broken code can never ship
    if: github.ref == 'refs/heads/main' # PRs test only; no push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            bakr1m/sepsis-api:latest
            bakr1m/sepsis-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test shipped image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            bakr1m/sepsis-api:${{ github.sha }}
          for i in $(seq 1 12); do
            curl -sf http://localhost:8000/health && break || sleep 10
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/score \
            -H "Content-Type: application/json" \
            -d @example_window.json | grep -q risk
          docker stop smoke && docker rm smoke
